name: Promote Android Production

on:
  workflow_dispatch:
    inputs:
      release_status:
        description: 'Google Play release status'
        required: false
        default: draft
        type: choice
        options:
          - draft
          - completed
      send_for_review:
        description: 'Send the production changes to Google Play for review'
        required: false
        default: false
        type: boolean

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm install googleapis@latest --no-save

      - name: Promote internal release to production
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          GOOGLE_PLAY_RELEASE_STATUS: ${{ inputs.release_status || 'draft' }}
          GOOGLE_PLAY_CHANGES_NOT_SENT_FOR_REVIEW: ${{ inputs.send_for_review != true }}
        run: node scripts/promote-google-play-production.mjs
