name: Submit Apple Review

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: 'App Store version to submit for review'
        required: true
        default: '1.1.9'

jobs:
  submit:
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Submit iOS version for review
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 || secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_BUNDLE_ID: com.ansioff.app.jordi
          APP_STORE_VERSION: ${{ inputs.app_version }}
        run: node scripts/submit-apple-review.mjs
