name: Dedupe Apple Screenshots

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: 'App Store version to inspect or dedupe'
        required: true
        default: '1.1.9'
      delete_duplicates:
        description: 'Set true to delete duplicate screenshots by filename'
        required: true
        default: 'false'

jobs:
  dedupe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Dedupe screenshots
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 || secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_BUNDLE_ID: com.ansioff.app.jordi
          APP_STORE_VERSION: ${{ inputs.app_version }}
          DELETE_DUPLICATES: ${{ inputs.delete_duplicates }}
        run: node scripts/dedupe-apple-screenshots.mjs
